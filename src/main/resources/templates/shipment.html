<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Delivery — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="app-sidebar" id="appSidebar">
    <a href="./index.html" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI Logistics</a>
    <div class="sidebar-section-label">Driver</div>
    <a href="dashboard.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i>My Deliveries</a>
    <div class="sidebar-section-label">Account</div>
    <a href="#" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <a href="dashboard.html" class="btn btn-sm btn-ghost-light"><i class="bi bi-arrow-left"></i></a>
        <div class="fw-semibold">Manage delivery</div>
      </div>
      <div class="avatar-chip user-chip-slot">—</div>
    </div>

    <div class="app-content" id="content"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/store.js"></script>
<script src="./assets/js/ai.js"></script>
<script src="./assets/js/app.js"></script>
<script>
  const session = Store.requireRole('driver');
  const id = new URLSearchParams(window.location.search).get('id');

  function draw(){
    const s = Store.getShipment(id);
    const content = document.getElementById('content');
    if(!s || s.driverId !== session.id){
      content.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle"></i>Shipment not found or not assigned to you.<br><a href="dashboard.html" class="text-amber">Back to deliveries</a></div>`;
      return;
    }
    const meta = statusMeta(s.status);
    const customer = Store.getCustomer(s.customerId);
    const isClosed = s.status === 'delivered' || s.status === 'cancelled';

    content.innerHTML = `
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="waybill">
            <div class="d-flex justify-content-between align-items-start">
              <div><div class="tag-id">${s.id}</div><h5 class="mt-1">${s.pickup.split(',')[0]} → ${s.drop.split(',')[0]}</h5></div>
              <span class="badge-status ${meta.badge}"><i class="bi ${meta.icon} me-1"></i>${meta.label}</span>
            </div>
            <div class="stitch"></div>
            <div class="row small">
              <div class="col-6 mb-2"><span class="text-ink-soft">Pickup</span><br><span class="fw-semibold">${s.pickup}</span></div>
              <div class="col-6 mb-2"><span class="text-ink-soft">Drop</span><br><span class="fw-semibold">${s.drop}</span></div>
              <div class="col-6 mb-2"><span class="text-ink-soft">Goods</span><br><span class="fw-semibold">${s.goods}</span></div>
              <div class="col-6 mb-2"><span class="text-ink-soft">Vehicle</span><br><span class="fw-semibold">${s.vehicle}</span></div>
              <div class="col-6"><span class="text-ink-soft">Customer</span><br><span class="fw-semibold">${customer ? customer.name : '—'}</span></div>
              <div class="col-6"><span class="text-ink-soft">Weight</span><br><span class="fw-semibold">${s.weightKg} kg</span></div>
            </div>
          </div>
          <div class="ai-box mt-3">
            <span class="ai-tag"><i class="bi bi-cpu"></i>AI status summary</span>
            <p class="small mt-2 mb-0">${summarizeShipment(s)}</p>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="panel mb-3">
            <h6 class="mb-3"><i class="bi bi-geo-alt me-1 text-teal"></i>Update location</h6>
            ${isClosed ? `<p class="small text-muted-light mb-0">This shipment is closed — no further updates needed.</p>` : `
            <form id="locForm">
              <input type="text" class="form-control mb-2" id="locInput" placeholder="e.g. Crossed DND Flyway toll plaza" required>
              <button class="btn btn-teal btn-sm w-100" type="submit"><i class="bi bi-broadcast me-1"></i>Push location update</button>
            </form>
            ${s.lastLocation ? `<div class="small text-muted-light mt-2">Last update: <span class="fw-semibold">${s.lastLocation}</span> · ${fmtDate(s.lastLocationAt)}</div>` : ''}
            `}
          </div>

          <div class="panel">
            <h6 class="mb-3"><i class="bi bi-check2-circle me-1 text-teal"></i>Mark delivered &amp; upload proof</h6>
            ${s.status === 'delivered' ? `<p class="small text-muted-light mb-0"><i class="bi bi-check-circle text-success me-1"></i>Delivered on ${fmtDate(s.deliveredAt)}. Proof: ${s.proof || '—'}</p>`
              : s.status === 'cancelled' ? `<p class="small text-muted-light mb-0">This shipment was cancelled by the customer.</p>`
              : `
              <form id="deliverForm">
                <label class="form-label small">Proof of delivery (photo / note)</label>
                <input type="file" class="form-control mb-2" id="proofFile" accept="image/*">
                <input type="text" class="form-control mb-3" id="proofNote" placeholder="Delivered to receptionist, signed by security">
                <button class="btn btn-amber btn-sm w-100" type="submit"><i class="bi bi-upload me-1"></i>Mark as delivered</button>
              </form>`}
          </div>
        </div>
      </div>
    `;

    const locForm = document.getElementById('locForm');
    if(locForm){
      locForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = document.getElementById('locInput').value.trim();
        if(!val) return;
        Store.updateShipmentLocation(s.id, val);
        toast('Location update pushed to customer.');
        draw();
      });
    }
    const deliverForm = document.getElementById('deliverForm');
    if(deliverForm){
      deliverForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const file = document.getElementById('proofFile').files[0];
        const note = document.getElementById('proofNote').value.trim();
        const proof = note || (file ? `Photo proof: ${file.name}` : 'Proof uploaded');
        Store.markDelivered(s.id, proof);
        toast('Shipment marked as delivered!');
        draw();
      });
    }
  }

  if(session){
    paintUserChip('.user-name-slot', '.user-chip-slot');
    wireLogout();
    initSidebarToggle();
    draw();
  }
</script>
</body>
</html>
