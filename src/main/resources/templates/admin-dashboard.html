<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
	<div class="app-shell">
		<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
		<aside class="app-sidebar" id="appSidebar">
			<a href="./index.html" class="navbar-brand mb-4 d-inline-flex"><span
				class="brand-mark">AL</span>AI Logistics</a>
			<div class="sidebar-section-label">Admin</div>
			<a href="dashboard.html" class="sidebar-link active"><i
				class="bi bi-grid-1x2"></i>Dashboard</a> <a href="drivers.html"
				class="sidebar-link"><i class="bi bi-people"></i>Drivers</a>
			<div class="sidebar-section-label">Account</div>
			<a href="#" class="sidebar-link logout-link"><i
				class="bi bi-box-arrow-right"></i>Log out</a>
		</aside>

		<main class="app-main">
			<div class="app-topbar">
				<div class="d-flex align-items-center gap-3">
					<button class="btn btn-sm btn-ghost-light d-lg-none"
						id="sidebarToggle">
						<i class="bi bi-list"></i>
					</button>
					<div>
						<div class="fw-semibold">Network overview</div>
						<div class="small text-muted-light">All customers &amp;
							drivers</div>
					</div>
				</div>
				<div class="avatar-chip user-chip-slot">—</div>
			</div>

			<div class="app-content">
				<div class="row g-3" id="statCards"></div>

				<div class="row g-4 mt-1">
					<div class="col-lg-8">
						<div class="panel">
							<div
								class="d-flex justify-content-between align-items-center mb-3">
								<h5 class="mb-0">All shipments</h5>
								<span class="chip" id="shipmentCount">—</span>
							</div>
							<div class="table-responsive">
								<table class="table table-manifest align-middle mb-0">
									<thead>
										<tr>
											<th>Shipment</th>
											<th>Route</th>
											<th>Driver</th>
											<th>Status</th>
											<th>Booked</th>
										</tr>
									</thead>
									<tbody id="shipmentRows"></tbody>
								</table>
							</div>
						</div>
					</div>
					<div class="col-lg-4">
						<div class="panel">
							<div
								class="d-flex justify-content-between align-items-center mb-3">
								<h6 class="mb-0">Pending driver approvals</h6>
								<a href="drivers.html" class="small text-amber">Manage <i
									class="bi bi-arrow-right"></i></a>
							</div>
							<div id="pendingDrivers"></div>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="./assets/js/store.js"></script>
	<script src="./assets/js/ai.js"></script>
	<script src="./assets/js/app.js"></script>
	<script>
  const session = Store.requireRole('admin');
  if(session){
    paintUserChip('.user-name-slot', '.user-chip-slot');
    wireLogout();
    initSidebarToggle();

    const shipments = Store.listAllShipments();
    const today = new Date().toDateString();
    const todayCount = shipments.filter(s => new Date(s.createdAt).toDateString() === today).length;
    const pending = shipments.filter(s => s.status === 'pending' || s.status === 'in_transit').length;
    const delivered = shipments.filter(s => s.status === 'delivered').length;
    const cancelled = shipments.filter(s => s.status === 'cancelled').length;

    const cards = [
      { label:"Today's Shipments", value: todayCount, icon:'bi-calendar2-check', color:'var(--teal)' },
      { label:'Pending', value: pending, icon:'bi-hourglass-split', color:'var(--amber)' },
      { label:'Delivered', value: delivered, icon:'bi-check-circle', color:'var(--green)' },
      { label:'Cancelled', value: cancelled, icon:'bi-x-circle', color:'var(--red)' }
    ];
    document.getElementById('statCards').innerHTML = cards.map(c => `
      <div class="col-6 col-lg-3">
        <div class="stat-card d-flex flex-column gap-3">
          <div class="stat-icon" style="background:${c.color}22; color:${c.color};"><i class="bi ${c.icon}"></i></div>
          <div><div class="stat-value">${c.value}</div><div class="stat-label">${c.label}</div></div>
        </div>
      </div>`).join('');

    document.getElementById('shipmentCount').textContent = shipments.length + ' total';
    document.getElementById('shipmentRows').innerHTML = shipments.map(s => {
      const meta = statusMeta(s.status);
      const driver = Store.getDriver(s.driverId);
      return `<tr>
        <td class="mono small">${s.id}</td>
        <td class="small">${s.pickup.split(',')[0]} → ${s.drop.split(',')[0]}</td>
        <td class="small text-muted-light">${driver ? driver.name : 'Unassigned'}</td>
        <td><span class="badge-status ${meta.badge}"><i class="bi ${meta.icon} me-1"></i>${meta.label}</span></td>
        <td class="small text-muted-light">${fmtDateShort(s.createdAt)}</td>
      </tr>`;
    }).join('');

    const pendingDrivers = Store.listDrivers().filter(d => d.status === 'pending');
    document.getElementById('pendingDrivers').innerHTML = pendingDrivers.length ? pendingDrivers.map(d => `
      <div class="d-flex align-items-center justify-content-between py-2 divider-dash">
        <div class="d-flex align-items-center gap-2">
          <div class="avatar-chip">${initials(d.name)}</div>
          <div><div class="fw-semibold small">${d.name}</div><div class="small text-muted-light">${d.vehicle}</div></div>
        </div>
        <a href="drivers.html" class="btn btn-sm btn-outline-amber">Review</a>
      </div>`).join('') : `<p class="small text-muted-light mb-0">No pending driver approvals. 🎉</p>`;
  }
</script>
</body>
</html>
