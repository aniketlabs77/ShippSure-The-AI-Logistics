<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Dashboard — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="app-sidebar" id="appSidebar">
    <a href="./index.html" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI Logistics</a>
    <div class="sidebar-section-label">Driver</div>
    <a href="./dashboard.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i>My Deliveries</a>
    <div class="sidebar-section-label">Account</div>
    <a href="#" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="fw-semibold user-name-slot">—</div>
          <div class="small text-muted-light">Driver account</div>
        </div>
      </div>
      <div class="avatar-chip user-chip-slot">—</div>
    </div>

    <div class="app-content">
      <h3 class="mb-1">Your delivery queue</h3>
      <p class="text-muted-light mb-4">Assigned shipments ready for pickup and delivery.</p>

      <div class="row g-3" id="statCards"></div>

      <div class="row g-3 mt-2" id="shipmentCards"></div>
      <div id="emptyState" class="empty-state d-none"><i class="bi bi-inbox"></i>No shipments assigned to you yet.</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/store.js"></script>
<script src="./assets/js/ai.js"></script>
<script src="./assets/js/app.js"></script>
<script>
  const session = Store.requireRole('driver');
  if(session){
    paintUserChip('.user-name-slot', '.user-chip-slot');
    wireLogout();
    initSidebarToggle();

    const shipments = Store.listShipmentsByDriver(session.id);
    const active = shipments.filter(s => s.status === 'pending' || s.status === 'in_transit');
    const delivered = shipments.filter(s => s.status === 'delivered');

    const cards = [
      { label:'Assigned to you', value: shipments.length, icon:'bi-boxes', color:'var(--teal)' },
      { label:'Active', value: active.length, icon:'bi-signpost-split', color:'var(--amber)' },
      { label:'Delivered', value: delivered.length, icon:'bi-check-circle', color:'var(--green)' }
    ];
    document.getElementById('statCards').innerHTML = cards.map(c => `
      <div class="col-6 col-lg-4">
        <div class="stat-card d-flex flex-column gap-3">
          <div class="stat-icon" style="background:${c.color}22; color:${c.color};"><i class="bi ${c.icon}"></i></div>
          <div><div class="stat-value">${c.value}</div><div class="stat-label">${c.label}</div></div>
        </div>
      </div>`).join('');

    document.getElementById('emptyState').classList.toggle('d-none', shipments.length > 0);
    document.getElementById('shipmentCards').innerHTML = shipments.map(s => {
      const meta = statusMeta(s.status);
      return `<div class="col-md-6 col-xl-4">
        <div class="waybill h-100 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start">
            <div><div class="tag-id">${s.id}</div><h5 class="mt-1">${s.pickup.split(',')[0]} → ${s.drop.split(',')[0]}</h5></div>
            <span class="badge-status ${meta.badge}"><i class="bi ${meta.icon} me-1"></i>${meta.label}</span>
          </div>
          <div class="stitch"></div>
          <div class="small text-ink-soft">Goods</div>
          <div class="fw-semibold small mb-2">${s.goods}</div>
          <div class="d-flex justify-content-between small mb-3">
            <span><i class="bi bi-truck-front me-1"></i>${s.vehicle}</span>
            <span><i class="bi bi-basket3 me-1"></i>${s.weightKg} kg</span>
          </div>
          <a href="shipment.html?id=${s.id}" class="btn btn-amber btn-sm mt-auto"><i class="bi bi-geo-alt me-1"></i>Manage delivery</a>
        </div>
      </div>`;
    }).join('');
  }
</script>
</body>
</html>
