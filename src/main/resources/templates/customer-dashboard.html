<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="app-sidebar" id="appSidebar">
    <a href="./index.html" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI Logistics</a>
    <div class="sidebar-section-label">Customer</div>
    <a href="dashboard.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i>Dashboard</a>
    <a href="book-shipment.html" class="sidebar-link"><i class="bi bi-box-seam"></i>Book Shipment</a>
    <a href="shipments.html" class="sidebar-link"><i class="bi bi-list-ul"></i>My Shipments</a>
    <div class="sidebar-section-label">Account</div>
    <a href="#" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="fw-semibold user-name-slot">—</div>
          <div class="small text-muted-light">Customer account</div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a href="book-shipment.html" class="btn btn-amber btn-sm d-none d-sm-inline-flex"><i class="bi bi-plus-lg me-1"></i>Book shipment</a>
        <div class="avatar-chip user-chip-slot">—</div>
      </div>
    </div>

    <div class="app-content">
      <h3 class="mb-1">Good to see you, <span class="user-name-slot">there</span> 👋</h3>
      <p class="text-muted-light mb-4">Here's what's moving today.</p>

      <div class="row g-3" id="statCards"></div>

      <div class="row g-4 mt-1">
        <div class="col-lg-8">
          <div class="panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0">Recent shipments</h5>
              <a href="shipments.html" class="small text-amber">View all <i class="bi bi-arrow-right"></i></a>
            </div>
            <div id="recentList"></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="ai-box">
            <span class="ai-tag"><i class="bi bi-cpu"></i>AI status brief</span>
            <p class="small mt-2 mb-0" id="aiHighlight">Loading summary…</p>
          </div>
          <div class="panel mt-3">
            <h6 class="mb-3">Quick actions</h6>
            <a href="book-shipment.html" class="btn btn-outline-amber btn-sm w-100 mb-2"><i class="bi bi-box-seam me-1"></i>Book a new shipment</a>
            <a href="shipments.html" class="btn btn-ghost-light btn-sm w-100"><i class="bi bi-search me-1"></i>Track a shipment</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/store.js"></script>
<script src="./assets/js/ai.js"></script>
<script src="./assets/js/app.js"></script>
<script>
  const session = Store.requireRole('customer');
  if(session){
    paintUserChip('.user-name-slot', '.user-chip-slot');
    wireLogout();
    initSidebarToggle();

    const shipments = Store.listShipmentsByCustomer(session.id);
    const today = new Date().toDateString();
    const todayCount = shipments.filter(s => new Date(s.createdAt).toDateString() === today).length;
    const pending = shipments.filter(s => s.status === 'pending' || s.status === 'in_transit').length;
    const delivered = shipments.filter(s => s.status === 'delivered').length;
    const cancelled = shipments.filter(s => s.status === 'cancelled').length;

    const cards = [
      { label:"Today's Shipments", value: todayCount, icon:'bi-calendar2-check', color:'var(--teal)' },
      { label:'Pending', value: pending, icon:'bi-hourglass-split', color:'var(--amber)' },
      { label:'Delivered', value: delivered, icon:'bi-check-circle', color:'var(--green)' },
      { label:'Cancelled', value: cancelled, icon:'bi-x-circle', color:'var(--red)' }
    ];
    document.getElementById('statCards').innerHTML = cards.map(c => `
      <div class="col-6 col-lg-3">
        <div class="stat-card d-flex flex-column gap-3">
          <div class="stat-icon" style="background:${c.color}22; color:${c.color};"><i class="bi ${c.icon}"></i></div>
          <div>
            <div class="stat-value">${c.value}</div>
            <div class="stat-label">${c.label}</div>
          </div>
        </div>
      </div>`).join('');

    const recent = shipments.slice(0, 4);
    document.getElementById('recentList').innerHTML = recent.length ? recent.map(s => {
      const meta = statusMeta(s.status);
      return `<div class="d-flex align-items-center justify-content-between py-2 divider-dash">
        <div>
          <div class="mono small text-muted-light">${s.id}</div>
          <div class="fw-semibold">${s.pickup.split(',')[0]} → ${s.drop.split(',')[0]}</div>
        </div>
        <div class="text-end">
          <span class="badge-status ${meta.badge}"><i class="bi ${meta.icon} me-1"></i>${meta.label}</span>
          <div class="mt-1"><a href="track.html?id=${s.id}" class="small text-amber">Track <i class="bi bi-arrow-right"></i></a></div>
        </div>
      </div>`;
    }).join('') : `<div class="empty-state"><i class="bi bi-inbox"></i>No shipments yet. <a href="book-shipment.html" class="text-amber">Book your first one</a>.</div>`;

    if(shipments.length){
      document.getElementById('aiHighlight').textContent = summarizeShipment(shipments[0]);
    } else {
      document.getElementById('aiHighlight').textContent = 'Book a shipment to get an AI-generated status brief here.';
    }
  }
</script>
</body>
</html>
