<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drivers — AI Logistics Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="app-sidebar" id="appSidebar">
    <a href="./index.html" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI Logistics</a>
    <div class="sidebar-section-label">Admin</div>
    <a href="./dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i>Dashboard</a>
    <a href="./drivers.html" class="sidebar-link active"><i class="bi bi-people"></i>Drivers</a>
    <div class="sidebar-section-label">Account</div>
    <a href="#" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div class="fw-semibold">Driver management</div>
      </div>
      <div class="avatar-chip user-chip-slot">—</div>
    </div>

    <div class="app-content">
      <div class="d-flex flex-wrap gap-2 mb-3" id="filterBar">
        <button class="btn btn-sm btn-ghost-light active" data-filter="all">All</button>
        <button class="btn btn-sm btn-ghost-light" data-filter="pending">Pending</button>
        <button class="btn btn-sm btn-ghost-light" data-filter="approved">Approved</button>
        <button class="btn btn-sm btn-ghost-light" data-filter="rejected">Rejected</button>
      </div>

      <div class="panel">
        <div class="table-responsive">
          <table class="table table-manifest align-middle mb-0">
            <thead>
              <tr><th>Driver</th><th>Contact</th><th>Vehicle</th><th>License</th><th>Status</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody id="driverRows"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state d-none"><i class="bi bi-people"></i>No drivers in this filter.</div>
      </div>
    </div>
  </main>
</div>

<!-- Delete confirm modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--navy-800); color:var(--paper); border:1px solid var(--line-soft);">
      <div class="modal-header border-0">
        <h5 class="modal-title">Delete driver?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted-light mb-0">This permanently removes <span class="fw-semibold" id="deleteDriverName">—</span> from the network. This can't be undone.</p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-ghost-light btn-sm" data-bs-dismiss="modal">Keep driver</button>
        <button type="button" class="btn btn-danger-soft btn-sm" id="confirmDeleteBtn">Delete driver</button>
      </div>
    </div>
  </div>
</div>

<!-- Driver profile modal -->
<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--navy-800); color:var(--paper); border:1px solid var(--line-soft);">
      <div class="modal-header border-0">
        <h5 class="modal-title">Driver profile</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/store.js"></script>
<script src="./assets/js/ai.js"></script>
<script src="./assets/js/app.js"></script>
<script>
  const session = Store.requireRole('admin');
  let activeFilter = 'all';
  let pendingDeleteId = null;
  let deleteModal, viewModal;

  function statusBadge(status){
    if(status === 'approved') return `<span class="badge-status badge-approved"><i class="bi bi-check-circle me-1"></i>Approved</span>`;
    if(status === 'rejected') return `<span class="badge-status badge-rejected"><i class="bi bi-x-circle me-1"></i>Rejected</span>`;
    return `<span class="badge-status badge-pending"><i class="bi bi-hourglass-split me-1"></i>Pending</span>`;
  }

  function render(){
    const all = Store.listDrivers();
    const list = activeFilter === 'all' ? all : all.filter(d => d.status === activeFilter);
    document.getElementById('driverRows').innerHTML = list.map(d => `
      <tr>
        <td>
          <div class="d-flex align-items-center gap-2">
            <div class="avatar-chip">${initials(d.name)}</div>
            <span class="fw-semibold">${d.name}</span>
          </div>
        </td>
        <td class="small text-muted-light">${d.email}<br>${d.phone}</td>
        <td><span class="chip"><i class="bi bi-truck-front me-1"></i>${d.vehicle}</span></td>
        <td class="mono small">${d.license}</td>
        <td>${statusBadge(d.status)}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-ghost-light view-btn" data-id="${d.id}"><i class="bi bi-eye"></i></button>
          ${d.status !== 'approved' ? `<button class="btn btn-sm btn-teal ms-1 approve-btn" data-id="${d.id}"><i class="bi bi-check-lg"></i></button>` : ''}
          ${d.status !== 'rejected' ? `<button class="btn btn-sm btn-outline-amber ms-1 reject-btn" data-id="${d.id}"><i class="bi bi-x-lg"></i></button>` : ''}
          <button class="btn btn-sm btn-danger-soft ms-1 delete-btn" data-id="${d.id}"><i class="bi bi-trash3"></i></button>
        </td>
      </tr>`).join('');
    document.getElementById('emptyState').classList.toggle('d-none', list.length > 0);

    document.querySelectorAll('.approve-btn').forEach(b => b.addEventListener('click', () => {
      Store.setDriverStatus(b.dataset.id, 'approved');
      toast('Driver approved.');
      render();
    }));
    document.querySelectorAll('.reject-btn').forEach(b => b.addEventListener('click', () => {
      Store.setDriverStatus(b.dataset.id, 'rejected');
      toast('Driver rejected.', 'amber');
      render();
    }));
    document.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', () => {
      const d = Store.getDriver(b.dataset.id);
      pendingDeleteId = b.dataset.id;
      document.getElementById('deleteDriverName').textContent = d ? d.name : '';
      deleteModal.show();
    }));
    document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => {
      const d = Store.getDriver(b.dataset.id);
      document.getElementById('viewModalBody').innerHTML = `
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="avatar-chip" style="width:52px;height:52px;font-size:1.1rem;">${initials(d.name)}</div>
          <div><div class="fw-bold fs-5">${d.name}</div>${statusBadge(d.status)}</div>
        </div>
        <div class="row small">
          <div class="col-6 mb-2"><span class="text-muted-light">Email</span><br>${d.email}</div>
          <div class="col-6 mb-2"><span class="text-muted-light">Phone</span><br>${d.phone}</div>
          <div class="col-6 mb-2"><span class="text-muted-light">Vehicle</span><br>${d.vehicle}</div>
          <div class="col-6 mb-2"><span class="text-muted-light">License</span><br class="mono">${d.license}</div>
        </div>`;
      viewModal.show();
    }));
  }

  if(session){
    paintUserChip('.user-name-slot', '.user-chip-slot');
    wireLogout();
    initSidebarToggle();
    deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
    viewModal = new bootstrap.Modal(document.getElementById('viewModal'));

    document.querySelectorAll('#filterBar button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filterBar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        render();
      });
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
      Store.deleteDriver(pendingDeleteId);
      deleteModal.hide();
      toast('Driver removed.', 'red');
      render();
    });

    render();
  }
</script>
</body>
</html>
