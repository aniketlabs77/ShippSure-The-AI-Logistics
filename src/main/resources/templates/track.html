<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Track Shipment — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="app-sidebar" id="appSidebar">
    <a href="./index.html" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI Logistics</a>
    <div class="sidebar-section-label">Customer</div>
    <a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2"></i>Dashboard</a>
    <a href="book-shipment.html" class="sidebar-link"><i class="bi bi-box-seam"></i>Book Shipment</a>
    <a href="shipments.html" class="sidebar-link active"><i class="bi bi-list-ul"></i>My Shipments</a>
    <div class="sidebar-section-label">Account</div>
    <a href="#" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <a href="shipments.html" class="btn btn-sm btn-ghost-light"><i class="bi bi-arrow-left"></i></a>
        <div class="fw-semibold">Track shipment</div>
      </div>
      <div class="avatar-chip user-chip-slot">—</div>
    </div>

    <div class="app-content" id="content">
      <!-- populated by JS -->
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/store.js"></script>
<script src="./assets/js/ai.js"></script>
<script src="./assets/js/app.js"></script>
<script>
  const session = Store.requireRole('customer');
  if(session){
    paintUserChip('.user-name-slot', '.user-chip-slot');
    wireLogout();
    initSidebarToggle();

    const id = new URLSearchParams(window.location.search).get('id');
    const s = Store.getShipment(id);
    const content = document.getElementById('content');

    if(!s || s.customerId !== session.id){
      content.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle"></i>Shipment not found.<br><a href="shipments.html" class="text-amber">Back to my shipments</a></div>`;
    } else {
      const meta = statusMeta(s.status);
      const driver = Store.getDriver(s.driverId);
      const canCancel = s.status === 'pending' || s.status === 'in_transit';

      content.innerHTML = `
        <div class="row g-4">
          <div class="col-lg-7">
            <div class="waybill">
              <div class="d-flex justify-content-between align-items-start">
                <div><div class="tag-id">${s.id}</div><h5 class="mt-1">${s.pickup.split(',')[0]} → ${s.drop.split(',')[0]}</h5></div>
                <span class="badge-status ${meta.badge}"><i class="bi ${meta.icon} me-1"></i>${meta.label}</span>
              </div>
              <div class="stitch"></div>
              <div class="row small">
                <div class="col-6 mb-2"><span class="text-ink-soft">Pickup</span><br><span class="fw-semibold">${s.pickup}</span></div>
                <div class="col-6 mb-2"><span class="text-ink-soft">Drop</span><br><span class="fw-semibold">${s.drop}</span></div>
                <div class="col-6 mb-2"><span class="text-ink-soft">Goods</span><br><span class="fw-semibold">${s.goods}</span></div>
                <div class="col-6 mb-2"><span class="text-ink-soft">Vehicle</span><br><span class="fw-semibold">${s.vehicle}</span></div>
                <div class="col-6"><span class="text-ink-soft">Weight</span><br><span class="fw-semibold">${s.weightKg} kg</span></div>
                <div class="col-6"><span class="text-ink-soft">Dimensions</span><br><span class="fw-semibold">${s.length}×${s.width}×${s.height} cm</span></div>
              </div>
            </div>

            <div class="panel mt-4">
              <h6 class="mb-3">Tracking timeline</h6>
              <ul class="timeline" id="timelineList"></ul>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="ai-box">
              <span class="ai-tag"><i class="bi bi-cpu"></i>AI status summary</span>
              <p class="small mt-2 mb-0">${summarizeShipment(s)}</p>
            </div>

            <div class="panel mt-3">
              <h6 class="mb-3">Assigned driver</h6>
              ${driver ? `
                <div class="d-flex align-items-center gap-3">
                  <div class="avatar-chip">${initials(driver.name)}</div>
                  <div>
                    <div class="fw-semibold">${driver.name}</div>
                    <div class="small text-muted-light">${driver.vehicle} · ${driver.phone}</div>
                  </div>
                </div>` : `<p class="small text-muted-light mb-0">A driver hasn't been assigned yet.</p>`}
              ${s.lastLocation ? `<div class="divider-dash my-3"></div><div class="small text-muted-light">Last checkpoint</div><div class="fw-semibold small"><i class="bi bi-geo-alt text-teal me-1"></i>${s.lastLocation}</div>` : ''}
            </div>

            ${canCancel ? `<button class="btn btn-danger-soft w-100 mt-3" id="cancelBtn"><i class="bi bi-x-circle me-1"></i>Cancel this shipment</button>` : ''}
          </div>
        </div>
      `;

      const tl = document.getElementById('timelineList');
      tl.innerHTML = s.history.map((h, idx) => {
        const isCurrent = h.done && idx === s.history.filter(x=>x.done).length - 1 && s.status !== 'delivered' && s.status !== 'cancelled';
        return `<li class="${h.done ? (isCurrent ? 'current' : 'done') : ''}">
          <div class="fw-semibold small">${h.label}</div>
          <div class="t-time">${h.time ? fmtDate(h.time) : 'Pending'}</div>
        </li>`;
      }).join('');

      const cancelBtn = document.getElementById('cancelBtn');
      if(cancelBtn){
        cancelBtn.addEventListener('click', () => {
          if(confirm('Cancel shipment ' + s.id + '? This cannot be undone.')){
            Store.cancelShipment(s.id);
            toast('Shipment cancelled.', 'amber');
            setTimeout(() => window.location.reload(), 600);
          }
        });
      }
    }
  }
</script>
</body>
</html>
